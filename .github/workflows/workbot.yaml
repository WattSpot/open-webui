name: Workbot fork qualification
on:
  push:
    branches: [workbot-preview-annotations]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5.4.0
        id: build
        with:
          context: .
          load: true
          tags: ghcr.io/wattspot/open-webui:workbot-${{ github.sha }}
          build-args: |
            USE_SLIM=true
            UID=1000
            GID=1000
      - name: Verify configuration and view contracts
        run: |
          docker run --rm -e WEBUI_SECRET_KEY=qualification-only ghcr.io/wattspot/open-webui:workbot-${GITHUB_SHA} python -m unittest discover -s tests -p 'test_*config.py'
      - name: Publish qualified image
        run: docker push ghcr.io/wattspot/open-webui:workbot-${GITHUB_SHA}
